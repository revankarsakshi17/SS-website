<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
background:#6C3BAA;
color:white;
}

/* SECTION */

.contact-section{
width:100%;
padding:80px 10%;
}

.contact-container{
display:flex;
justify-content:space-between;
gap:60px;
flex-wrap:wrap;
}

/* LEFT SIDE */

.contact-info{
flex:1;
min-width:280px;
}

.contact-info h2{
font-size:40px;
margin-bottom:20px;
}

.contact-info p{
font-size:18px;
margin-bottom:20px;
line-height:1.6;
}

.info-item{
margin-bottom:12px;
font-size:17px;
}

/* RIGHT SIDE */

.contact-form{
flex:1;
min-width:280px;
background:white;
padding:40px;
border-radius:6px;
color:#333;
}

.contact-form h2{
font-size:30px;
margin-bottom:20px;
}

form{
display:flex;
flex-direction:column;
gap:15px;
}

input, textarea{
padding:14px;
border:1px solid #ccc;
font-size:16px;
width:100%;
}

textarea{
min-height:140px;
resize:none;
}

button{
padding:14px;
border:none;
background:#6C3BAA;
color:white;
font-size:16px;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#542b8a;
}

/* RESPONSIVE */

@media(max-width:768px){

.contact-container{
flex-direction:column;
}

.contact-info{
text-align:center;
}

}

</style>
</head>

<body>

<section class="contact-section">

<div class="contact-container">

<!-- LEFT SIDE -->

<div class="contact-info">

<h2>Contact Us</h2>

<p>
Have a project in mind or want to collaborate with us?  
Reach out and let's build something great together.
</p>

<div class="info-item"><strong>Phone:</strong> +91 8792757839</div>
<div class="info-item"><strong>Email:</strong> helpsocialsanta@gmail.com</div>
<div class="info-item"><strong>Location:</strong> Bangalore, India</div>

</div>

<!-- RIGHT SIDE -->

<div class="contact-form">

<h2>Send a Message</h2>

<form action="https://formspree.io/f/yourFormID" method="POST">

<input type="text" name="name" placeholder="Your Name" required>

<input type="email" name="email" placeholder="Your Email" required>

<textarea name="message" placeholder="Your Message" required></textarea>

<button type="submit">Send Message</button>

</form>

</div>

</div>

</section>

</body>
</html>
